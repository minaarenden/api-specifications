openapi: 3.0.3
info:
  title: Producentens API för avisering - Hantering av prenumerationer
  description:
    En beskrivning av API:et som en producent behöver sätta upp för att erbjuda aviseringsfunktionalitet i samarbete med Min ärendens vidareförmedlingstjänst
    Denna fil innehåller beskrivningar av endpoints för hantering av prenumerationer
  version: 1.0
paths:
  /kundhandelser-prenumerationer/upplagg:
    post:
      summary: Lägg upp prenumeration
      description: Anropas från vidareförmedlingstjänsten när en konsument vill lägga upp en prenumeration på kundhändelser
      parameters:
        - $ref: '../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upplaggRequestSchema'
      responses:
        "200":
          description: Prenumerationen upplagd. Detta svar skickas om användaren/konsumenten var auktoriserad på minst en kundhändelsetype. Om den inte var auktoriserad på någon kundhändelsetyp skall 403 skickas istället
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upplaggResponseSchema'
        "403":
          description: Användaren/konsumenten var inte auktoriserad på någon begärd kundhändelsetyp. Ingen prenumeration är upplagd
        "501":
          description:
            Producenten stödjer inte efterfrågad funktionalitet.
            Det kan t ex röra sig om anrop med taggar, juridiskt läsombud eller att identifera kund med ärende
  /kundhandelser-prenumerationer/borttag:
    post:
      summary: Ta bort en prenumeration
      description: Anropas från vidareförmedlingstjänsten när en konsument vill ta bort en prenumeration på kundhändelser
      parameters:
        - $ref: '../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/borttagRequestSchema'
      responses:
        "200":
          description: Prenumerationen borttagen
        "404":
          description: Skickas till exempel när producentPrenumerationsID inte finns
        "403":
          description: Skickas när prenumerationen tillhör en annan användare eller konsumenttjänst
  /kundhandelser-prenumerationer/andra:
    post:
      summary: Ändra en prenumerations
      description: Anropas från vidareförmedlingtjänsten när en konsument vill ändra en prenumeration
      parameters:
        - $ref: '../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/andraRequestSchema'
      responses:
        "200":
          description: Ändringen genomförd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/andraResponseSchema'
        "404":
          description: Skickas till exempel när producentPrenumerationsID inte finns
        "403":
          description: Skickas när prenumerationen tillhör en annan användare eller konsumenttjänst
        "501":
          description:
            Producenten stödjer inte efterfrågad funktionalitet. (ändring av taggar)
components:
  schemas:
    upplaggRequestSchema:
      type: object
      properties:
        part:
          $ref: '../common/schemas.yaml#/components/schemas/part'
        kundhandelseTyper:
          $ref: '../common/schemas.yaml#/components/schemas/kundhandelseTyper'
        taggar:
          type: array
          description:
            Producenten kan definiera taggar (textsträngar) som pekar ut specifika kundhändelsetyper. T.ex. kan man tänka sig att Skatteverket definierar en tagg som pekar ut alla kundhändelsetyper som har med företagande att göra, eller med beskattningsverksamheten.
            Varje tagg pekar ut specifika producentärendetyper och/eller specifika kundhändelsetyper.
            Det är inte säkert att alla producenter stödjer taggar. Om det inte stöds får de svara med ett felsvar (501)
          items:
            type: string
        anvandare:
          $ref: '../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../common/schemas.yaml#/components/schemas/konsumenttjanst'
        slutdatum:
          description:
            Önskat slutdatum.
            Vidareförmedlingstjäntsen har satt slutdatum så att det är max ett år framåt i tiden.
          type: string
          format: date
        onskadAviseringsTyp:
          $ref: '../common/schemas.yaml#/components/schemas/onskadAviseringsTyp'
        auktoristionsMetod:
          $ref: '../common/schemas.yaml#/components/schemas/auktoristionsMetod'
      required:
        - part
        - konsumenttjanst
        - slutdatum
        - onskadAviseringstyp
    upplaggResponseSchema:
      type: object
      properties:
        producentPrenumerationsID:
          $ref: '../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        kundhandelseTypsInformation:
          type: array
          description:
            En lista med information om hur det gick med efterfrågade kundhändelsetyper. 
            Svaret innehåller information om vilka kundhändelsetyper på lövnivå man har fått prenumeration på samt hur många kundhändelsetyper på lövnivå som man inte är auktoriserad för.
          items:
            type: object
            description:
              Visar vad som hände med en begärd uppsättning kundhändelsetyper, dvs en sträng i fältet kundhändelseTyper eller en sträng i fältet taggar i frågan
            properties:
              begardKundhandelseTyp:
                type: string
                description: Vad begärdes (med eventuell wildcard)
              kundhandelseTyper:
                type: array
                description: Auktoriserade kundhändelsetypers (på lövnivå) identifierare. Om användaren inte var auktoriserad på någon av de begärda kundhändelsetyperna blir listan tom
                items:
                  type: string
              antalIckeAuktoriserade:
                type: number
                description: Hur många kundhändelsetyper för denna begärda kundhändelsetyp var användaren/konsumenttjänsten inte auktoriserad på.
            required:
              - begardKundhandelseTyp
              - antalIckeAuktoriserade
      required:
        - producentPrenumerationsID
        - kundhandelseTypsInformation
    borttagRequestSchema:
      type: object
      properties:
        producentPrenumerationsID:
          $ref: '../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        anvandare:
          $ref: '../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../common/schemas.yaml#/components/schemas/konsumenttjanst'
        auktoristionsMetod:
          $ref: '../common/schemas.yaml#/components/schemas/auktoristionsMetod'
      required:
        - producentPrenumerationsID
        - konsumenttjanst
    andraRequestSchema:
      type: object
      properties:
        producentPrenumerationsID:
          $ref: '../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        anvandare:
          $ref: '../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../common/schemas.yaml#/components/schemas/konsumenttjanst'
        auktorisationsMetod:
          $ref: '../common/schemas.yaml#/components/schemas/auktoristionsMetod'
        slutdatum:
          description:
            Nytt önskat slutdatum
            Om detta slutdatum är före existerande slutdatum sätts detta datum som nytt slutdatum (resultatet blir alltså en förkortning)
            Om parametern utelämnas ändras inte slutdatumet
          type: string
          format: date
        kundhandelseTypAndrngar:
          description:
            Varje tillägg eller borttag av kundhändelsetyp skall ha ett objekt i den här listan
          type: array
          items:
            type: object
            properties:
              kundhandelseTyp:
                description:
                  kundhandelseTyp	Vilken kundhändelsetyp som skall läggas till eller tas bort
                  Kan vara wildcards
                type: string
              andringsTyp:
                $ref: '#/components/schemas/andringsTyp'
            required:
              - kundhandelseTyp
              - andringsTyp
        tagAndringar:
          description:
            Varje tillägg eller borttag av tag skall ha ett eget objekt i den här listan
            Om producenten inte stödjer hanteirng av taggar skall man svara med felfall 501 om det finns objekt i den här listan
          type: array
          items:
            type: object
            properties:
              tag:
                description:
                  Vilken tag skall läggas till eller tas bort
                type: string
              andringsTyp:
                $ref: '#/components/schemas/andringsTyp'
            required:
              - tag
              - andringsTyp
      required:
        - producentPrenumerationsID
        - konsumenttjanst
    andraResponseSchema:
      type: object
      properties:
        slutdatum:
          type: string
          description:
            Slutdatum som det faktiskt blev i och med förlängningen prenumerationen (inklusive)
            Attributet saknas om ingen ändring gjorts
          format: date
        kundhandelseTypAndringar:
          type: array
          description: En lista med ändringar på kundhändelsetyper som faktiskt skett. Om inga ändringar skett är listan tom
          items:
            type: object
            properties:
              kundhandelseTyp:
                type: string
                description: Vilken kundhändelsetyp som ändrades
              andringsTyp:
                $ref: '#/components/schemas/andringsTyp'
            required:
              - kundhandelseTyp
              - andringsTyp
        tagAndringar:
          type: array
          description: En lista med ändringar på kundhändelsetyper som faktiskt skett. Om inga ändringar skett är listan tom
          items:
            type: object
            properties:
              tag:
                description:
                  Vilken tag som ändrades
                type: string
              andringsTyp:
                $ref: '#/components/schemas/andringsTyp'
            required:
              - tag
              - andringsTyp
    andringsTyp:
      description:
        Vilken sorts ändring vill man göra
      type: string
      enum:
        - TILLÄGG
        - BORTTAG
  
