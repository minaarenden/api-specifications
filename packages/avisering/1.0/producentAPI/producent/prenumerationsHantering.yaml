openapi: 3.0.3
info:
  title: Producentens API för avisering - Hantering av prenumerationer
  description:
    En beskrivning av API:et som en producent behöver sätta upp för att erbjuda aviseringsfunktionalitet i samarbete med Min ärendens vidareförmedlingstjänst
    Denna fil innehåller beskrivningar av endpoints för hantering av prenumerationer
  version: 1.0
paths:
  /kundhandelser-prenumerationer/upplagg:
    post:
      summary: Lägg upp prenumeration
      description: Anropas från vidareförmedlingstjänsten när en konsument vill lägga upp en prenumeration på kundhändelser
      parameters:
        - $ref: '../../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/producentUpplaggRequest'
      responses:
        "200":
          description:
            Prenumerationen upplagd. 
            Observera att det kan vara så att användaren/konsumenttjänsten inte var behörig på någonting av det man begärde att prenumerera på. Detta faktum indikeras i svaret men det blir ändå ett 200-svar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/producentUpplaggResponse'
        "501":
          description:
            Producenten stödjer inte efterfrågad funktionalitet.
            Det kan t ex röra sig om anrop med taggar, juridiskt läsombud eller att identifera part med ärende
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
  /kundhandelser-prenumerationer/borttag:
    post:
      summary: Ta bort en prenumeration
      description: Anropas från vidareförmedlingstjänsten när en konsument vill ta bort en prenumeration på kundhändelser
      parameters:
        - $ref: '../../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/producentBorttagRequest'
      responses:
        "200":
          description: Prenumerationen borttagen
        "404":
          description: Skickas till exempel när producentPrenumerationsID inte finns
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
        "403":
          description: Skickas när prenumerationen tillhör en annan användare eller konsumenttjänst
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
  /kundhandelser-prenumerationer/andra:
    post:
      summary: Ändra en prenumerations
      description: Anropas från vidareförmedlingtjänsten när en konsument vill ändra en prenumeration
      parameters:
        - $ref: '../../common/parameters.yaml#/components/parameters/requestId'
        - $ref: '../../common/parameters.yaml#/components/parameters/correlationId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/producentAndraRequest'
      responses:
        "200":
          description: Ändringen genomförd
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/producentAndraResponse'
        "404":
          description: Skickas till exempel när producentPrenumerationsID inte finns eller om konsumenten försöker ta bort en kundhändelsetyp eller tag som inte ingår i prenumerationen
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
        "403":
          description: Skickas när prenumerationen tillhör en annan användare eller konsumenttjänst
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
        "501":
          description:
            Producenten stödjer inte efterfrågad funktionalitet. (ändring av taggar)
          content:
            application/problem+json:
              schema:
                $ref: '../../common/schemas.yaml#/components/schemas/error'
components:
  schemas:
    producentUpplaggRequest:
      type: object
      properties:
        part:
          $ref: '../../common/schemas.yaml#/components/schemas/part'
        kundhandelseTyper:
          $ref: '../../common/schemas.yaml#/components/schemas/kundhandelseTyper'
        taggar:
          $ref: '../../common/schemas.yaml#/components/schemas/taggar'
        anvandare:
          $ref: '../../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../../common/schemas.yaml#/components/schemas/konsumenttjanst'
        slutdatum:
          description:
            Önskat slutdatum.
            Vidareförmedlingstjäntsen har satt slutdatum så att det är max ett år framåt i tiden.
          type: string
          format: date
        onskadAviseringsTyp:
          $ref: '../../common/schemas.yaml#/components/schemas/onskadAviseringsTyp'
        auktoristionsMetod:
          $ref: '../../common/schemas.yaml#/components/schemas/auktoristionsMetod'
      required:
        - part
        - konsumenttjanst
        - slutdatum
        - onskadAviseringstyp
    producentUpplaggResponse:
      type: object
      properties:
        producentPrenumerationsID:
          $ref: '../../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        kundhandelseTypsInformation:
          type: array
          description:
            En lista med information om hur det gick med efterfrågade kundhändelsetyper. 
            Svaret innehåller information om vilka kundhändelsetyper på lövnivå man har fått prenumeration på samt hur många kundhändelsetyper på lövnivå som man inte är auktoriserad för.
          items:
            type: object
            description:
              Visar vad som hände med en begärd uppsättning kundhändelsetyper, dvs en sträng i fältet kundhändelseTyper eller en sträng i fältet taggar i frågan
            properties:
              begardKundhandelseTyp:
                type: string
                description: Vad begärdes (med eventuell wildcard)
              kundhandelseTyper:
                type: array
                description: Auktoriserade kundhändelsetypers (på lövnivå) identifierare. Om användaren inte var auktoriserad på någon av de begärda kundhändelsetyperna blir listan tom
                items:
                  type: string
              antalIckeAuktoriserade:
                type: number
                description: Hur många kundhändelsetyper för denna begärda kundhändelsetyp var användaren/konsumenttjänsten inte auktoriserad på.
            required:
              - begardKundhandelseTyp
              - antalIckeAuktoriserade
      required:
        - producentPrenumerationsID
        - kundhandelseTypsInformation
    producentBorttagRequest:
      type: object
      properties:
        producentPrenumerationsID:
          $ref: '../../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        anvandare:
          $ref: '../../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../../common/schemas.yaml#/components/schemas/konsumenttjanst'
        auktoristionsMetod:
          $ref: '../../common/schemas.yaml#/components/schemas/auktoristionsMetod'
      required:
        - producentPrenumerationsID
        - konsumenttjanst
    producentAndraRequest:
      type: object
      properties:
        # Attributen om kan ändras är slutdatum, kundhändelsetyper eller taggar
        # Övriga properties används för att identifera prenumerationen och vem som vill göra ändringen
        producentPrenumerationsID:
          $ref: '../../common/schemas.yaml#/components/schemas/producentPrenumerationsID'
        anvandare:
          $ref: '../../common/schemas.yaml#/components/schemas/anvandare'
        konsument:
          $ref: '../../common/schemas.yaml#/components/schemas/konsument'
        konsumenttjanst:
          $ref: '../../common/schemas.yaml#/components/schemas/konsumenttjanst'
        auktorisationsMetod:
          $ref: '../../common/schemas.yaml#/components/schemas/auktoristionsMetod'
        slutdatum:
          description:
            Nytt önskat slutdatum
            Om detta slutdatum är före existerande slutdatum sätts detta datum som nytt slutdatum (resultatet blir alltså en förkortning)
            Om parametern utelämnas ändras inte slutdatumet
          type: string
          format: date
        kundhandelseTypAndrngar:
          $ref: '../../common/schemas.yaml#/components/schemas/kundhandelseTypAndrngar'
        tagAndringar:
          $ref: '../../common/schemas.yaml#/components/schemas/tagAndringar'
      required:
        - producentPrenumerationsID
        - konsumenttjanst
    producentAndraResponse:
      type: object
      properties:
        slutdatum:
          type: string
          description:
            Slutdatum som det faktiskt blev i och med förlängningen prenumerationen (inklusive)
            Attributet saknas om ingen ändring gjorts
          format: date
        kundhandelseTypAndringar:
          $ref: '../../common/schemas.yaml#/components/schemas/kundhandelseTypAndrngar'
        tagAndringar:
          $ref: '../../common/schemas.yaml#/components/schemas/tagAndringar'

